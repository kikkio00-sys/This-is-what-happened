<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0907">
<title>This Is What Happened</title>
<!-- Maintainable build: structure, styles, scripts, and images are stored separately. -->

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
 integrity="sha256-p4NxAoJBhIINfQ3ynhZkWgF/MZbMZr9Y50jIF9eQyqk=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
 integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="homepage-fixes.css">
</head>
<body>
<section class="entrance active-view" id="entrance">
<header class="entrance-header"><div class="monogram">T</div><div><h1>This Is What Happened</h1><p>A living archive of four families</p></div></header>
<nav class="family-line"><button data-family>Zahner</button><button data-family>Downing</button><button data-family>Blackwell</button><button data-family>Barrett</button></nav>
<section class="family-map" aria-labelledby="family-map-title">
  <p id="family-map-title" class="family-map-title">Choose a family line</p>
  <div class="family-map-stage" role="group" aria-label="Four family lines">
    <button type="button" class="family-map-branch" data-map-family="Zahner">Zahner</button>
    <button type="button" class="family-map-branch" data-map-family="Downing">Downing</button>
    <button type="button" class="family-map-branch" data-map-family="Blackwell">Blackwell</button>
    <button type="button" class="family-map-branch" data-map-family="Barrett">Barrett</button>
    <p class="family-map-root">One archive · four family lines.</p>
  </div>
</section>
<main class="object-grid">
<button class="object-card" data-room="families"><img src="family-book.jpg" alt="Antique family history book"><span><strong>Meet the Family</strong><small>Meet the families</small></span></button>
<button class="object-card" data-room="wanderings"><img src="wanderings-map.jpg" alt="Historic map"><span><strong>Wanderings</strong><small>See where they wandered</small></span></button>
<button class="object-card" data-room="album"><img src="photo-album.jpg" alt="Historic family photograph album"><span><strong>Photographs</strong><small>Browse photographs</small></span></button>
<button class="object-card" data-room="livelihoods"><img src="brass-compass.jpg" alt="Antique brass compass"><span><strong>Lives &amp; Livelihoods</strong><small>How they lived and worked</small></span></button>
<button class="object-card" data-room="stories"><img src="gramophone.jpg" alt="Antique gramophone"><span><strong>Narrated Stories</strong><small>Listen to their voices</small></span></button>
<button class="object-card" data-room="archive"><img src="card-catalog.jpg" alt="Archive card catalog"><span><strong>Archive &amp; Junk Drawer</strong><small>Sources, documents and more</small></span></button>
<button class="object-card discovery-card" data-room="discovery"><img src="family-book.jpg" alt="Family archive discovery"><span><strong>Add a Discovery</strong><small>Enter once. Review. Publish everywhere.</small></span></button>
</main>
<button class="inventory-handle" id="inventoryHandle">Archive inventory ⌃</button>
<aside class="inventory" id="inventory"><div class="inventory-head"><strong>Inside the archive</strong><button id="closeInventory">×</button></div><div class="count-grid" id="countGrid"></div></aside>
</section>
<section class="room" id="room"><header class="room-header"><button class="back-button" id="backButton">←</button><div><p class="room-kicker" id="roomKicker"></p><h2 id="roomTitle"></h2><p id="roomIntro"></p></div></header><main class="room-content" id="roomContent"></main></section>

<script src="app.js"></script>
</body></html>
