<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0907">
<title>This Is What Happened</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<section class="entrance active-view" id="entrance">
<header class="entrance-header"><div class="monogram">T</div><div><h1>This Is What Happened</h1><p>A living archive of four families</p></div></header>
<nav class="family-line"><button data-family>Zahner</button><button data-family>Downing</button><button data-family>Blackwell</button><button data-family>Barrett</button></nav>
<main class="object-grid">
<button class="object-card" data-room="families"><img src="family-book.jpg" alt=""><span><strong>Family Assembly</strong><small>Meet the families</small></span></button>
<button class="object-card" data-room="wanderings"><img src="wanderings-map.jpg" alt=""><span><strong>Wanderings</strong><small>See where they wandered</small></span></button>
<button class="object-card" data-room="album"><img src="photo-album.jpg" alt=""><span><strong>Album</strong><small>Browse photographs</small></span></button>
<button class="object-card" data-room="livelihoods"><img src="brass-compass.jpg" alt=""><span><strong>Lives &amp; Livelihoods</strong><small>How they lived and worked</small></span></button>
<button class="object-card" data-room="stories"><img src="gramophone.jpg" alt=""><span><strong>Narrated Stories</strong><small>Listen to their voices</small></span></button>
<button class="object-card" data-room="archive"><img src="card-catalog.jpg" alt=""><span><strong>Archive &amp; Junk Drawer</strong><small>Sources, documents and more</small></span></button>
</main>
<button class="inventory-handle" id="inventoryHandle">Archive inventory ⌃</button>
<aside class="inventory" id="inventory"><div class="inventory-head"><strong>Inside the archive</strong><button id="closeInventory">×</button></div><div class="count-grid" id="countGrid"></div></aside>
</section>
<section class="room" id="room"><header class="room-header"><button class="back-button" id="backButton">←</button><div><p class="room-kicker" id="roomKicker"></p><h2 id="roomTitle"></h2><p id="roomIntro"></p></div></header><main class="room-content" id="roomContent"></main></section>
<script src="app.js"></script>
</body></html>
